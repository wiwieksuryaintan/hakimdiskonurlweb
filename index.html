<script>

async function loginTikTok() {

  const statusBox = document.getElementById("status");

  statusBox.innerHTML = "Connecting to TikTok...";

  try {

    const webhook =
      "https://faishalkim.app.n8n.cloud/webhook-test/tiktok/callback";

    // request ke n8n
    const response = await fetch(webhook, {
      method: "GET"
    });

    // tampilkan status HTTP
    console.log("HTTP Status:", response.status);

    // ambil text dulu
    const text = await response.text();

    console.log("RAW RESPONSE:", text);

    // coba parse json
    let data;

    try {
      data = JSON.parse(text);
    } catch (jsonError) {

      statusBox.innerHTML =
        "Invalid JSON response ❌";

      console.error("JSON ERROR:", jsonError);

      return;
    }

    // cek username
    if (data.username) {

      statusBox.innerHTML =
        "Connected as: " +
        data.username +
        " ✔";

    } else {

      statusBox.innerHTML =
        "Username not found ❌";

    }

  } catch (err) {

    console.error("FETCH ERROR:", err);

    statusBox.innerHTML =
      "Cannot reach n8n webhook ❌";

  }

}

</script>
