<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HAKIM DISKON</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 14px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #fe2c55;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #e91e63;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #111;
      color: #00ff88;
      font-size: 14px;
    }

    .small {
      margin-top: 15px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>HAKIM DISKON</h1>

    <p>Connect your TikTok account to continue</p>

    <button onclick="loginTikTok()">
      Login with TikTok
    </button>

    <div id="status">
      Not connected
    </div>

    <div class="small">
      TikTok OAuth Demo Integration
    </div>

  </div>

  <script>

    async function loginTikTok() {

      document.getElementById("status").innerHTML =
        "Connecting to TikTok...";

      try {

        // GANTI DENGAN URL WEBHOOK N8N KAMU
        const webhook =
          "https://n8n.hakimdiskon.com/webhook/tiktok/callback";

        const response = await fetch(webhook);

        const data = await response.json();

        document.getElementById("status").innerHTML =
          "Connected as: " +
          data.username +
          " ✔";

      } catch (err) {

        document.getElementById("status").innerHTML =
          "Connection failed ❌";

      }

    }

  </script>

</body>
</html>
