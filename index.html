<!DOCTYPE html>
<html>

<head>
  <title>HAKIM DISKON</title>
</head>

<body style="background:black;color:white;font-family:Arial;text-align:center;padding-top:100px;">

<h1>HAKIM DISKON</h1>

<button onclick="loginTikTok()">
Login with TikTok
</button>

<p id="status">Not connected</p>

<script>

async function loginTikTok() {

  document.getElementById("status").innerHTML =
    "Connecting...";

  try {

    const response = await fetch(
      "https://faishalkim.app.n8n.cloud/webhook-test/tiktok/callback"
    );

    const data = await response.json();

    document.getElementById("status").innerHTML =
      "Connected ✔";

    console.log(data);

  } catch (e) {

    console.log(e);

    document.getElementById("status").innerHTML =
      "Webhook error ❌";

  }

}

</script>

</body>
</html>
